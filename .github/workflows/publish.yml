name: Publish manual

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing manual release tag to redeploy"
        required: true
        type: string
      source_ref:
        description: "Optional source commit or branch for documentation corrections (defaults to the release tag)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-manual
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render book

      - name: Prepare latest and versioned sites
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          mkdir publish
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            mkdir previous
            git archive FETCH_HEAD | tar -x -C previous
            if [ -d previous/versions ]; then
              cp -a previous/versions publish/
            fi
          fi

          cp -a book/_site/. publish/
          # Retire the 2.8.0 web snapshot; its Git tag and release remain available.
          rm -rf publish/versions/2.8.0

          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Release tag must match vX.Y.Z (received: $RELEASE_TAG)" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          if [ -f previous/versions.json ]; then
            jq -s '.[0] + .[1] | unique_by(.version)' \
              previous/versions.json publish/versions.json > publish/versions.tmp
            mv publish/versions.tmp publish/versions.json
          fi
          jq --arg version "$version" \
            '[{version: $version, label: $version}] + [.[] | select(.version != $version and .version != "2.8.0")]' \
            publish/versions.json > publish/versions.tmp
          mv publish/versions.tmp publish/versions.json

          rm -rf "publish/versions/$version"
          mkdir -p "publish/versions/$version"
          cp -a book/_site/. "publish/versions/$version/"
          touch publish/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true
