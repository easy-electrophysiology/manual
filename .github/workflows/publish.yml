name: Publish manual

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-manual
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render book

      - name: Prepare latest and versioned sites
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mkdir publish
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --quiet --branch gh-pages --single-branch "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" previous
            if [ -d previous/versions ]; then
              cp -a previous/versions publish/
            fi
          fi

          cp -a book/_site/. publish/
          if [ -f previous/versions.json ]; then
            cp previous/versions.json publish/versions.json
          fi

          if [[ ! "$RELEASE_TAG" =~ ^manual-v([0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Release tag must match manual-vX.Y.Z (received: $RELEASE_TAG)" >&2
            exit 1
          fi

          version="${RELEASE_TAG#manual-v}"
          jq --arg version "$version" \
            '[{version: $version, label: $version}] + [.[] | select(.version != $version)]' \
            publish/versions.json > publish/versions.tmp
          mv publish/versions.tmp publish/versions.json

          rm -rf "publish/versions/$version"
          mkdir -p "publish/versions/$version"
          cp -a book/_site/. "publish/versions/$version/"
          touch publish/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
          force_orphan: true